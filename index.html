  .kicker{text-transform:uppercase; letter-spacing:3px; font-size:12px; color:var(--ink); font-weight:700;}
  .yr{font-size:12px; color:var(--soft); letter-spacing:1px;}
  h1{font-family:'Fraunces',serif; font-weight:900; font-size:clamp(48px,13vw,96px); line-height:.92; margin:8px 0 0; letter-spacing:-.02em;}
  .progress{display:flex; align-items:center; gap:18px; margin-bottom:32px; flex-wrap:wrap;}
  .plabel{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--soft); margin-bottom:6px;}
  .bar{height:12px; background:var(--line); border-radius:20px; overflow:hidden; border:1px solid var(--ink);}
  .fill{height:100%; background:var(--ink); transition:width .4s ease;}
  .pct{font-family:'Fraunces',serif; font-weight:900; font-size:38px; line-height:1; color:var(--ink);}
  .pcs{font-size:12px; color:var(--soft);}
  section{margin-bottom:38px;}
  h2{font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin:0 0 14px; display:flex; align-items:center; gap:10px;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block; background:var(--ink);}
  .habit{margin-bottom:20px;}
  .hrow{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px;}
  .hname{font-weight:600; font-size:15px;}
  .htarget{font-size:11px; color:var(--soft); font-style:italic;}
  .hmeta{display:flex; align-items:center; gap:12px; flex-shrink:0;}
  .hcount{font-size:12px; color:var(--soft);}
  .grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; max-width:420px;}
  .wd{text-align:center; font-size:10px; color:var(--soft); font-weight:600;}
  .cell{aspect-ratio:1; border-radius:6px; background:var(--card); border:1px solid var(--ink); color:var(--ink); font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:600; cursor:pointer; transition:transform .1s ease;}
  .cell:active{transform:scale(.9);}
  .cell.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .cell.off{border-color:var(--line); color:var(--line); cursor:default;}
  footer{border-top:1px solid var(--line); padding-top:16px; font-size:12px; color:var(--soft); font-style:italic; font-family:'Fraunces',serif;}
  footer .resetbtn{border:1px solid var(--ink); background:#fff; color:var(--ink); border-radius:4px; padding:6px 14px; font-size:12px; font-style:normal; font-family:'Hanken Grotesk'; cursor:pointer; margin-top:10px;}
  footer .resetbtn:active{background:var(--ink); color:#fff;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const YEAR=2026, MONTH=7; // August, 0-indexed
const DAYS=new Date(YEAR, MONTH+1, 0).getDate(); // 31
const LEAD=(new Date(YEAR, MONTH, 1).getDay()+6)%7; // Monday-start offset
const WD=["M","T","W","T","F","S","S"];
const KEY="august-tracker-app-v6";
const CATS=[
  {cat:"fitness", label:"Fitness"},
  {cat:"nutrition", label:"Nutrition"},
  {cat:"finance", label:"Finance"}
];
const DEFAULTS={
  habits:[
    {id:"gym",cat:"fitness",name:"Gym",target:"4× per week"},
    {id:"padel",cat:"fitness",name:"Padel",target:"1× per week"},
    {id:"steps",cat:"fitness",name:"10,000 steps",target:"daily"},
    {id:"protein",cat:"nutrition",name:"120g protein",target:"daily"},
    {id:"caloriedeficit",cat:"nutrition",name:"Calorie deficit",target:"daily"},
    {id:"noalcohol",cat:"nutrition",name:"No alcohol",target:"daily"},
    {id:"nospend",cat:"finance",name:"No spend day",target:"2× per week"}
  ],
  completions:{}
};

let data;

function load(){
  try{ const raw=localStorage.getItem(KEY); data=raw?Object.assign({},DEFAULTS,JSON.parse(raw)):structuredClone(DEFAULTS); }
  catch(e){ data=structuredClone(DEFAULTS); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ console.warn("save failed",e); } }

function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const total=Object.keys(data.completions).length;
  const TRACK_DAYS=DAYS-3;
  const possible=data.habits.length*TRACK_DAYS;
  const pct=possible?Math.round(total/possible*100):0;

  let html=`
  <header>
    <div class="masthead">
      <div class="kicker">The Monthly Almanac</div>
      <div class="yr">MMXXVI · HABIT TRACKER</div>
    </div>
    <h1>August <span style="font-weight:400;color:var(--soft)">2026</span></h1>
  </header>
  <div class="progress">
    <div style="flex:1 1 200px">
      <div class="plabel">Month progress</div>
      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <div style="text-align:right">
      <div class="pct">${pct}%</div>
      <div class="pcs">${total} of ${possible} checks</div>
    </div>
  </div>`;

  CATS.forEach(g=>{
    html+=`<section><h2><span class="dot"></span>${esc(g.label)}</h2>`;
    data.habits.filter(h=>h.cat===g.cat).forEach(h=>{
      const startDay = 3;
      const endDay = DAYS-1;
      let done=0; for(let dd=startDay; dd<=endDay; dd++) if(data.completions[h.id+":"+dd]) done++;
      const weeklyMatch = (h.target||"").match(/(\d+)\s*×?\s*per week/i);
      let countLabel;
      if(weeklyMatch){
        const perWeek = parseInt(weeklyMatch[1], 10);
        const weeks = TRACK_DAYS/7; // 28 days = 4 weeks
        const needed = perWeek*weeks;
        countLabel = `${done} / ${needed}`;
      } else {
        countLabel = `${done}/${endDay-startDay+1}`;
      }
      html+=`<div class="habit">
        <div class="hrow">
          <span><span class="hname">${esc(h.name)}</span>${h.target?` <span class="htarget">· ${esc(h.target)}</span>`:""}</span>
          <span class="hmeta"><span class="hcount">${countLabel}</span></span>
        </div>
        <div class="grid">`;
      WD.forEach(w=> html+=`<div class="wd">${w}</div>`);
      for(let i=0;i<LEAD;i++) html+=`<div></div>`;
      for(let dd=1;dd<=DAYS;dd++){
        const on=!!data.completions[h.id+":"+dd];
        const disabled = dd < startDay || dd > endDay;
        if(disabled){
          html+=`<div class="cell off">${dd}</div>`;
        } else {
          html+=`<div class="cell ${on?'on':''}" onclick="toggle('${h.id}',${dd})">${dd}</div>`;
        }
      }
      html+=`</div></div>`;
    });
    html+=`</section>`;
  });

  html+=`<footer>Tap any day to mark it done. Everything saves on your phone.
    <br><button class="resetbtn" onclick="resetAll()">Reset all data</button>
  </footer>`;
  document.getElementById("app").innerHTML=html;
}

function toggle(id,day){
  const k=id+":"+day;
  if(data.completions[k]) delete data.completions[k]; else data.completions[k]=true;
  save(); render();
}
function resetAll(){
  if(confirm('This clears all habits and progress on this device. Continue?')){
    data=structuredClone(DEFAULTS);
    save(); render();
  }
}

load(); render();
</script>
</body>
</html>
